<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 402" role="img"><title>Correct design: the secret stays on the server</title><style>
.bg{fill:#f2f4f1}.t{font:500 14px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#13304f}
.s{font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#4f6882}
.box{fill:#ffffff;stroke:#9fb3c4;stroke-width:.75}
.ln{stroke:#4f6882;stroke-width:1.4;fill:none}
.cli{fill:#fbeee9;stroke:#c2603f;stroke-width:.75}.cli-t{fill:#7a2e15}
.srv{fill:#e6f2ec;stroke:#1f6b4e;stroke-width:.75}.srv-t{fill:#134a35}
.llm{fill:#ecebf8;stroke:#5a52b3;stroke-width:.75}.llm-t{fill:#2f2a75}
.sec{fill:#fbe4e4;stroke:#c1121f;stroke-width:1.2}.sec-t{fill:#8c0d17}
.dash{fill:none;stroke:#7d93a8;stroke-width:.75;stroke-dasharray:4 3}
@media (prefers-color-scheme:dark){
.bg{fill:#10314f}.t{fill:#edf2f5}.s{fill:#a9bed1}.box{fill:#0b2742;stroke:#2e5479}.ln{stroke:#a9bed1}
.cli{fill:#3a2219;stroke:#e0896a}.cli-t{fill:#f5c4b3}.srv{fill:#0f3a30;stroke:#6cc29b}.srv-t{fill:#bfe8d4}
.llm{fill:#26244d;stroke:#a9a2ec}.llm-t{fill:#d6d3fa}.sec{fill:#4a1418;stroke:#ff7a7a}.sec-t{fill:#ffc9c9}.dash{stroke:#5d7c99}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" width="680" height="402"/><rect class="cli" x="30" y="20" width="140" height="300" rx="16"/><text class="t cli-t" x="100.0" y="46" text-anchor="middle" dominant-baseline="central">Client</text><text class="s cli-t" x="100.0" y="64" text-anchor="middle" dominant-baseline="central">Attacker-controlled</text><rect class="box" x="48" y="140" width="104" height="56" rx="8"/><text class="t" x="100.0" y="159.0" text-anchor="middle" dominant-baseline="central">Browser</text><text class="s" x="100.0" y="177.0" text-anchor="middle" dominant-baseline="central">Sends a prompt</text><rect class="srv" x="210" y="20" width="260" height="300" rx="16"/><text class="t srv-t" x="340.0" y="46" text-anchor="middle" dominant-baseline="central">Server</text><text class="s srv-t" x="340.0" y="64" text-anchor="middle" dominant-baseline="central">Fixed code, trusted zone</text><rect class="box" x="230" y="84" width="220" height="56" rx="8"/><text class="t" x="340.0" y="103.0" text-anchor="middle" dominant-baseline="central">Chat handler</text><text class="s" x="340.0" y="121.0" text-anchor="middle" dominant-baseline="central">Builds prompt, no secret</text><rect class="box" x="230" y="166" width="220" height="56" rx="8"/><text class="t" x="340.0" y="185.0" text-anchor="middle" dominant-baseline="central">Tool code</text><text class="s" x="340.0" y="203.0" text-anchor="middle" dominant-baseline="central">Checks the session's role</text><rect class="sec" x="230" y="248" width="220" height="56" rx="8"/><text class="t sec-t" x="340.0" y="267.0" text-anchor="middle" dominant-baseline="central">Secret (env / vault)</text><text class="s" x="340.0" y="285.0" text-anchor="middle" dominant-baseline="central">Read only by the tool</text><rect class="llm" x="510" y="20" width="140" height="300" rx="16"/><text class="t llm-t" x="580.0" y="46" text-anchor="middle" dominant-baseline="central">LLM</text><text class="s llm-t" x="580.0" y="64" text-anchor="middle" dominant-baseline="central">Can be fooled</text><rect class="box" x="526" y="140" width="108" height="56" rx="8"/><text class="t" x="580.0" y="159.0" text-anchor="middle" dominant-baseline="central">Model</text><text class="s" x="580.0" y="177.0" text-anchor="middle" dominant-baseline="central">Never sees it</text><path class="ln" d="M152 160 L228 120" marker-end="url(#a)"/><path class="ln" d="M450 112 L524 152" marker-end="url(#a)"/><path class="ln" d="M524 184 L452 194" marker-end="url(#a)"/><path class="ln" d="M340 222 L340 246" marker-end="url(#a)"/><rect class="box" x="30" y="338" width="620" height="44" rx="8"/><text class="t" x="340.0" y="360.0" text-anchor="middle" dominant-baseline="central">The secret never crosses to the LLM or the client: only server code uses it</text></svg>