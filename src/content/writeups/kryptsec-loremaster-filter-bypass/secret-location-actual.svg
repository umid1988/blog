<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 442" role="img"><title>The Loremaster: where the secret actually lives</title><style>
.bg{fill:#f2f4f1}.t{font:500 14px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#13304f}
.s{font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#4f6882}
.box{fill:#ffffff;stroke:#9fb3c4;stroke-width:.75}
.ln{stroke:#4f6882;stroke-width:1.4;fill:none}
.cli{fill:#fbeee9;stroke:#c2603f;stroke-width:.75}.cli-t{fill:#7a2e15}
.srv{fill:#e6f2ec;stroke:#1f6b4e;stroke-width:.75}.srv-t{fill:#134a35}
.llm{fill:#ecebf8;stroke:#5a52b3;stroke-width:.75}.llm-t{fill:#2f2a75}
.sec{fill:#fbe4e4;stroke:#c1121f;stroke-width:1.2}.sec-t{fill:#8c0d17}
.dash{fill:none;stroke:#7d93a8;stroke-width:.75;stroke-dasharray:4 3}
@media (prefers-color-scheme:dark){
.bg{fill:#10314f}.t{fill:#edf2f5}.s{fill:#a9bed1}.box{fill:#0b2742;stroke:#2e5479}.ln{stroke:#a9bed1}
.cli{fill:#3a2219;stroke:#e0896a}.cli-t{fill:#f5c4b3}.srv{fill:#0f3a30;stroke:#6cc29b}.srv-t{fill:#bfe8d4}
.llm{fill:#26244d;stroke:#a9a2ec}.llm-t{fill:#d6d3fa}.sec{fill:#4a1418;stroke:#ff7a7a}.sec-t{fill:#ffc9c9}.dash{stroke:#5d7c99}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" width="680" height="442"/><rect class="cli" x="20" y="20" width="130" height="340" rx="16"/><text class="t cli-t" x="85.0" y="46" text-anchor="middle" dominant-baseline="central">Client</text><text class="s cli-t" x="85.0" y="64" text-anchor="middle" dominant-baseline="central">The attacker</text><rect class="box" x="34" y="166" width="102" height="56" rx="8"/><text class="t" x="85.0" y="185.0" text-anchor="middle" dominant-baseline="central">Browser</text><text class="s" x="85.0" y="203.0" text-anchor="middle" dominant-baseline="central">Story prompt</text><rect class="srv" x="180" y="20" width="230" height="340" rx="16"/><text class="t srv-t" x="295.0" y="46" text-anchor="middle" dominant-baseline="central">Server</text><text class="s srv-t" x="295.0" y="64" text-anchor="middle" dominant-baseline="central">Loremaster backend</text><rect class="box" x="198" y="80" width="194" height="56" rx="8"/><text class="t" x="295.0" y="99.0" text-anchor="middle" dominant-baseline="central">1. Input filter</text><text class="s" x="295.0" y="117.0" text-anchor="middle" dominant-baseline="central">Beaten by a synonym</text><rect class="box" x="198" y="166" width="194" height="56" rx="8"/><text class="t" x="295.0" y="185.0" text-anchor="middle" dominant-baseline="central">Prompt builder</text><text class="s" x="295.0" y="203.0" text-anchor="middle" dominant-baseline="central">Adds the secret to it</text><rect class="box" x="198" y="270" width="194" height="56" rx="8"/><text class="t" x="295.0" y="289.0" text-anchor="middle" dominant-baseline="central">3. Output filter</text><text class="s" x="295.0" y="307.0" text-anchor="middle" dominant-baseline="central">Beaten by 4-char groups</text><rect class="llm" x="440" y="20" width="220" height="340" rx="16"/><text class="t llm-t" x="550.0" y="46" text-anchor="middle" dominant-baseline="central">LLM</text><text class="s llm-t" x="550.0" y="64" text-anchor="middle" dominant-baseline="central">Mnemo model</text><rect class="dash" x="456" y="76" width="188" height="196" rx="8"/><text class="s" x="550" y="92" text-anchor="middle" dominant-baseline="central">Model context</text><rect class="box" x="466" y="104" width="168" height="44" rx="6"/><text class="t" x="550.0" y="126.0" text-anchor="middle" dominant-baseline="central">System prompt</text><rect class="sec" x="466" y="158" width="168" height="44" rx="6"/><text class="t sec-t" x="550.0" y="180.0" text-anchor="middle" dominant-baseline="central">Secret: KX{0d15…120b}</text><rect class="box" x="466" y="212" width="168" height="44" rx="6"/><text class="t" x="550.0" y="234.0" text-anchor="middle" dominant-baseline="central">Your story request</text><text class="t llm-t" x="550" y="326" text-anchor="middle" dominant-baseline="central">2. Rule: "don't share"</text><text class="s llm-t" x="550" y="344" text-anchor="middle" dominant-baseline="central">Fooled by the story</text><path class="ln" d="M136 185 L196 120" marker-end="url(#a)"/><path class="ln" d="M295 136 L295 164" marker-end="url(#a)"/><path class="ln" d="M392 194 L454 194" marker-end="url(#a)"/><path class="ln" d="M550 272 L550 298 L394 298" marker-end="url(#a)"/><path class="ln" d="M198 298 L85 298 L85 224" marker-end="url(#a)"/><rect class="sec" x="20" y="378" width="640" height="44" rx="8"/><text class="t sec-t" x="340.0" y="400.0" text-anchor="middle" dominant-baseline="central">The secret sits in the model's context, guarded only by filters and the model's behaviour</text></svg>